# Author: Claude (Anthropic) for Ken Rother, 2026
# The P8X project website: MkDocs 1.6 + Material over the documents stage.py copies from this repository.
# ./build.sh builds it (website/README.md).
site_name: P8X
site_description: A hand-built 8-bit microcoded TTL CPU, its FPGA twin with a graphics engine, and the monitor, disk OS, BASIC and C compilers that run on both.
site_author: Ken Rother
repo_url: https://github.com/ksr/p8x
repo_name: ksr/p8x
edit_uri: blob/main/
docs_dir: stage
site_dir: site
use_directory_urls: true
copyright: "P8X by Ken Rother — <a href=\"https://cottageworker.com\">cottageworker.com</a>."
not_in_nav: |
  /commands/*.md
hooks:
  - hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle: {icon: material/brightness-4, name: Light mode}

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  # GitHub-style heading ids (no collapsing of hyphens), so the anchors the p8x documents write for GitHub work here
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - admonition
  - pymdownx.superfences
  - pymdownx.details

