; pcb-check's settings for the backplane (~/Developer/pcb-check: the check before any order).
;   pcb-check p8x-backplane.kicad_pcb p8x-backplane-gerbers.zip --layers 4 [--tests]
[board]
name = P8X BACKPLANE
rev = C
size = 262 x 128
holes = 6
; the eight bus sockets J1..J8 (DIN 41612, 3 x 32), every pin of each on the bus
bus_pins = python3 ../../../generators/bus_pins.py --backplane
; the system's tests: make qa-quick (about 3-7 minutes: emulator test-quick, the co-sims, the netlist ERC;
; it fails if a tracked file changes). `make qa` (about 40 minutes) is the whole suite, before an order
tests = cd ../../.. && make qa-quick
