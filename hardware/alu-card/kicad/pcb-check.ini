; pcb-check's settings for the P8X ALU Card (~/Developer/pcb-check: the check before any order).
;   pcb-check p8x-alu-card.kicad_pcb p8x-alu-card-gerbers.zip --layers 4 [--tests]
[board]
name = P8X ALU CARD
rev = B
size = 280 x 140
; the card's own mounting is the DIN plug's; no separate holes
holes = 0
; the bus plug J1 (DIN 41612, 3 x 32) stands along the left edge; the front edge is the right one
bus_edge = left
; the backplane's slots are 28 mm apart (generators/gen_backplane.py SLOT_PITCH)
slot_pitch = 28
; the bus pinout, from gen_eagle.busnet(), the definition the boards are generated from
bus_pins = python3 ../../../generators/bus_pins.py
; the system's tests: the emulator's quick subset (about 7 minutes; `make test`, about 25, before an order)
tests = cd ../../../emulator && make test-quick
